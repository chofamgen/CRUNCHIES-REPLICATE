<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crunchies demo</title>
    <link rel="stylesheet" href="style.css">
    <meta name="crunchies bread" content="project on responsiveness">


    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=location_on" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>

<body>

    <div class="container">
        <header>
            <div class="logo">
                <img src="./images/main logo.webp" alt="crunchies logo">

                <div class="location">
                    <span class="material-symbols-outlined">
                        location_on
                    </span>
                    <p>set location</p>
                </div>

            </div>

            <nav>
                <a class="home" href="#">Home</a>
                <a href="#">Menu</a>
                <a href="#">My account</a>
                <a href="#">Support</a>
            </nav>

            <span class="material-symbols-outlined cart-icon">
                shopping_cart_checkout
            </span>

        </header>
    </div>

    <main class="maincon">
        <div class="text">
            <p1 class="top-text">
                Welcome to Crunchies!
            </p1>

            <h1>
                Taste the <br> Difference...
            </h1>

            <p class="sub-text">
                How would you like to receive your <br>order?
            </p>
        </div>


        <div class="image">
            <img src="./images/woman.webp" alt="sweet ladyh">

        </div>

    </main>




</body>

</html>
